name: Build Tweak
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS_PACKAGE_SCHEME: roothide
      FINALPACKAGE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl make unzip wget ldid dpkg-dev

      - name: Setup roothide‑Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iPhoneOS15.2.sdk zip
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          wget --tries=5 --timeout=90 -O master.zip https://github.com/xybp888/iOS-SDKs/archive/refs/heads/master.zip
          unzip -q master.zip
          mv iOS-SDKs-master/iPhoneOS15.2.sdk .
          rm -rf master.zip iOS-SDKs-master

      - name: Compile tweak
        run: make package

      - name: Export .deb
        uses: actions/upload-artifact@v4
        with:
          name: built-deb
          path: packages/*.deb