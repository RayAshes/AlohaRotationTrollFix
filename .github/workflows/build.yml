name: Build Tweak
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/theos/theos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix SDK name if needed
        run: |
          export THEOS=/theos
          cd $THEOS/sdks
          ln -sf iPhoneOS15.2.sdk iPhoneOS15.2.sdk

      - name: Build tweak
        run: |
          export THEOS=/theos
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: built-deb
          path: packages/*.deb