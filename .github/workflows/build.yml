name: Build Tweak
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl make unzip wget

      - name: Setup Theos
        run: |
          curl -fsSL https://theos.dev/install.sh | sh
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iPhoneOS15.2.sdk zip
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          wget --no-check-certificate -O iPhoneOS15.2.sdk.zip https://github.com/xybp888/iOS-SDKs/archive/refs/heads/master.zip
          unzip -q iPhoneOS15.2.sdk.zip
          mv iOS-SDKs-master/iPhoneOS15.2.sdk .
          rm -rf iPhoneOS15.2.sdk.zip iOS-SDKs-master

      - name: Compile tweak
        run: make package

      - name: Export .deb
        uses: actions/upload-artifact@v4
        with:
          name: built-deb
          path: packages/*.deb