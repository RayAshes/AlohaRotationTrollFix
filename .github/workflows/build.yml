name: Build‑TrollFools‑Safe (remove DRS)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Compile drstool from source
        run: |
          git clone --depth 1 https://github.com/xybp888/drstool.git
          swiftc drstool/drstool.swift -o drstool
          chmod +x ./drstool

      - name: Fetch iOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git ~/sdks
          git -C ~/sdks sparse-checkout set iPhoneOS16.5.sdk
          echo "SDKROOT=$HOME/sdks/iPhoneOS16.5.sdk" >> $GITHUB_ENV

      - name: Build universal dylib
        run: |
          xcrun clang \
            -arch arm64 \
            -isysroot "$SDKROOT" \
            -mios-version-min=15.0 \
            -fobjc-arc -O2 \
            -dynamiclib \
            -framework Foundation -framework CoreMotion \
            Tweak.m \
            -o arm64.dylib

          xcrun clang \
            -arch arm64e \
            -isysroot "$SDKROOT" \
            -mios-version-min=15.0 \
            -fobjc-arc -O2 \
            -dynamiclib \
            -framework Foundation -framework CoreMotion \
            Tweak.m \
            -o arm64e.dylib

          xcrun lipo -create arm64.dylib arm64e.dylib -o tweak.dylib

      - name: Delete LC_DYLIB_CODE_SIGN_DRS
        run: ./drstool tweak.dylib

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tweak
          path: tweak.dylib