name: Build Tweak
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl make wget subversion

      - name: Setup Theos
        run: |
          export THEOS=/home/runner/theos
          curl -fsSL https://theos.dev/install.sh | sh
          echo "THEOS=/home/runner/theos" >> $GITHUB_ENV

      - name: Download iPhoneOS15.2.sdk
        run: |
          mkdir -p /home/runner/theos/sdks
          cd /home/runner/theos/sdks
          svn export --force https://github.com/xybp888/iOS-SDKs/trunk/iPhoneOS15.2.sdk

      - name: Compile tweak
        run: |
          export THEOS=/home/runner/theos
          make package

      - name: Export .deb
        uses: actions/upload-artifact@v4
        with:
          name: built-deb
          path: packages/*.deb