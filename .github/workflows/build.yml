name: Build RootHide Tweak

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build.yml'
      - '**/*.h'
      - '**/*.m'
      - '**/*.xm'
      - '**/*.xmi'
      - '**/*.plist'
      - 'Makefile'
      - 'control'
      - 'layout/**'

permissions:
  contents: read

jobs:
  build:
    name: Build RootHide Tweak (macOS‑14)
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
      FINALPACKAGE: 1
      SDKVERSION: 16.5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun clang --version

      - name: Install dependencies
        run: |
          set -euo pipefail
          brew update
          brew install dpkg ldid make
          echo "Homebrew GNU make: $(which gmake)"
          gmake -v

      - name: Clone RootHide‑patched Theos
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Fetch fixed iPhoneOS16.5 SDK
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Compile tweak
        run: |
          set -euo pipefail
          # 只在这一步局部优先gnu make，不污染全局PATH
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$THEOS/bin:$PATH"
          rm -rf packages artifacts
          mkdir -p artifacts
          LOG=artifacts/build.log
          gmake clean SDKVERSION=$SDKVERSION 2>&1 | tee "$LOG"
          gmake package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 SDKVERSION=$SDKVERSION 2>&1 | tee -a "$LOG"
          if grep -qi 'incompatible arm64e abi compiler' "$LOG";then
            echo "::error::arm64e ABI不匹配"
            exit 1
          fi
          DEB=$(find packages -name '*.deb' | head -1)
          [ -n "$DEB" ]
          cp "$DEB" artifacts/

      - name: Basic binary validation
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$THEOS/bin:$PATH"
          DEB=$(find artifacts -name '*.deb' | head -1)
          [ -n "$DEB" ]
          echo "Package name: $(dpkg-deb -f "$DEB" Package)"
          echo "Architecture: $(dpkg-deb -f "$DEB" Architecture)"
          [ "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64e" ]

          TMP=/tmp/tweak‑verify
          rm -rf "$TMP"
          mkdir -p "$TMP"
          dpkg-deb -x "$DEB" "$TMP"

          find "$TMP" -type f \( -name "*.dylib" -o -name "*.bundle" \) | while read -r bin;do
            if xcrun lipo -archs "$bin" | grep -q arm64e;then
              echo "Checking $bin"
              xcrun vtool -arch arm64e -show-build "$bin" | grep -E 'minos|sdk'
              xcrun vtool -arch arm64e -show-build "$bin" | grep -q 'minos[[:space:]]*15\.'
            fi
          done

          {
            echo "deb=$(basename "$DEB")"
            echo "sha256=$(shasum -a256 "$DEB" | awk '{print $1}')"
          } > artifacts/info.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tweak-roothide-build
          path: artifacts/
          retention-days: 30