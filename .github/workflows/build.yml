name: Build TrollInject Dylib

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build.yml'
      - '**/*.h'
      - '**/*.m'
      - '**/*.xm'
      - '**/*.xmi'
      - 'Makefile'

permissions:
  contents: read

jobs:
  build:
    name: Build TrollInject Dylib (macOS‑14)
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      SDKVERSION: 16.5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          xcrun clang --version

      - name: Install dependencies
        run: |
          set -euo pipefail
          brew update
          brew install ldid make
          echo "Homebrew GNU make: $(which gmake)"
          gmake -v

      - name: Clone vanilla Theos（原版theos，不用roothide补丁）
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Fetch fixed iPhoneOS16.5 SDK
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Compile dylib only（只编译，不打包deb）
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$THEOS/bin:$PATH"
          rm -rf packages build artifacts
          mkdir -p artifacts
          LOG=artifacts/build.log
          gmake clean SDKVERSION=$SDKVERSION 2>&1 | tee "$LOG"
          gmake all V=1 SDKVERSION=$SDKVERSION 2>&1 | tee -a "$LOG"
          DYLIB=$(find . -name '*.dylib' | head -1)
          [ -n "$DYLIB" ]
          cp "$DYLIB" artifacts/

      - name: Binary check
        run: |
          set -euo pipefail
          DYLIB=$(find artifacts -name '*.dylib' | head -1)
          echo "File: $DYLIB"
          xcrun lipo -archs "$DYLIB"
          xcrun vtool -arch arm64e -show-build "$DYLIB" | grep minos

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trollinject-dylib-build
          path: artifacts/
          retention-days: 30