name: Build Tweak
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl make subversion

      - name: Setup Theos
        run: |
          curl -fsSL https://theos.dev/install.sh | sh
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Checkout iPhoneOS15.2.sdk from xybp888/iOS‑SDKs
        run: |
          mkdir -p "$HOME/theos/sdks"
          cd "$HOME/theos/sdks"
          svn export https://github.com/xybp888/iOS-SDKs/trunk/iPhoneOS15.2.sdk

      - name: Compile tweak
        run: make package

      - name: Export .deb
        uses: actions/upload-artifact@v4
        with:
          name: built-deb
          path: packages/*.deb