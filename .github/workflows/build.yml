name: Build Tweak
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git make curl wget xz-utils zstd binutils

      - name: Download cross‑clang (xia0599 mirror)
        run: |
          wget https://github.xia0599.workers.dev/https://github.com/xia0599/cross-clang/releases/download/18.1.7/cross-clang-aarch64-apple-darwin.tar.zst
          mkdir -p ~/toolchain
          tar -I zstd -xf cross-clang-aarch64-apple-darwin.tar.zst -C ~/toolchain
          echo "TOOLCHAIN=$HOME/toolchain" >> $GITHUB_ENV
          echo "$HOME/toolchain/bin" >> $GITHUB_PATH

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Get iPhoneOS15.2 SDK
        run: |
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          wget -O iPhoneOS15.2.sdk.tar.xz https://github.xia0599.workers.dev/https://github.com/renn0xtek/ios-sdk-archive/releases/download/sdks/iPhoneOS15.2.sdk.tar.xz
          tar -xf iPhoneOS15.2.sdk.tar.xz
          rm -f iPhoneOS15.2.sdk.tar.xz

      - name: Build tweak
        run: make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: built-deb
          path: packages/*.deb