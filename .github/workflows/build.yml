name: Build‑TrollFools‑Compatible‑Tweak
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos‑latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Fetch iOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks
          cd sdks
          git sparse‑checkout set iPhoneOS15.2.sdk

      - name: Compile tweak (arm64 + arm64e thin)
        run: |
          export SDKROOT=$PWD/sdks/iPhoneOS15.2.sdk
          clang -arch arm64 -arch arm64e -dynamiclib Tweak.m -o tweak.fat \
            -isysroot $SDKROOT -fvisibility=hidden -ObjC

      - name: Split fat binary to thin slices
        run: |
          lipo tweak.fat -extract arm64 -o arm64.dylib
          lipo tweak.fat -extract arm64e -o arm64e.dylib

      - name: Remove LC_DYLIB_CODE_SIGN_DRS from each slice
        run: |
          brew install opttool
          opttool --delete‑load‑command 0x2A arm64.dylib
          opttool --delete‑load‑command 0x2A arm64e.dylib

      - name: Repack universal fat binary
        run: |
          lipo -create arm64.dylib arm64e.dylib -output tweak.dylib

      - name: Upload
        uses: actions/upload‑artifact@v4
        with:
          name: tweak
          path: tweak.dylib