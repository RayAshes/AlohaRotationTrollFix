name: Build Tweak
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/theos/theos:latest
    steps:
      - uses: actions/checkout@v4

      - name: Get iPhoneOS15.2.sdk
        run: |
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          wget -O iPhoneOS15.2.sdk.tar.xz https://github.com/renn0xtek/ios-sdk-archive/releases/download/sdks/iPhoneOS15.2.sdk.tar.xz
          tar -xf iPhoneOS15.2.sdk.tar.xz
          rm -f iPhoneOS15.2.sdk.tar.xz
          ls -ld $THEOS/sdks/iPhoneOS15.2.sdk

      - name: Build
        run: make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: built-deb
          path: packages/*.deb