name: Build Tweak
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install base packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget zstd build-essential xz-utils

      - name: Download prebuilt Procursus cross‑clang
        run: |
          wget https://github.com/ProcursusTeam/build-tools/releases/download/v20250418/cross-clang-aarch64-apple-darwin.tar.zst
          mkdir -p ~/procursus-toolchain
          tar -I zstd -xf cross-clang-aarch64-apple-darwin.tar.zst -C ~/procursus-toolchain
          echo "TOOLCHAIN=$HOME/procursus-toolchain" >> $GITHUB_ENV
          echo "$HOME/procursus-toolchain/bin" >> $GITHUB_PATH

      - name: Get Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download & extract iPhoneOS15.2.sdk
        run: |
          mkdir -p ~/theos/sdks
          cd ~/theos/sdks
          # 这个源是打包好的 tar.xz
          wget -O iPhoneOS15.2.sdk.tar.xz https://github.com/renn0xtek/ios-sdk-archive/releases/download/sdks/iPhoneOS15.2.sdk.tar.xz
          tar -xf iPhoneOS15.2.sdk.tar.xz
          rm -f iPhoneOS15.2.sdk.tar.xz
          ls -la ~/theos/sdks

      - name: Build tweak
        run: make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: built-deb
          path: packages/*.deb