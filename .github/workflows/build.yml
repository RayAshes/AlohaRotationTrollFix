name: Build TrollInject Dylib

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build.yml'
      - 'Tweak.m'
      - 'entitlements.plist'

permissions:
  contents: read

jobs:
  build:
    name: Build real Mach‑O dylib
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install ldid
        run: brew install ldid

      - name: Download iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          echo "SDKROOT=$THEOS/sdks/iPhoneOS16.5.sdk" >> $GITHUB_ENV

      - name: Compile FAT dynamic library
        run: |
          set -e
          xcrun clang \
            -arch arm64 \
            -isysroot "$SDKROOT" \
            -mios-version-min=15.0 \
            -fobjc-arc -O2 \
            -dynamiclib \
            -framework Foundation -framework CoreMotion \
            Tweak.m \
            -o arm64.dylib

          xcrun clang \
            -arch arm64e \
            -isysroot "$SDKROOT" \
            -mios-version-min=15.0 \
            -fobjc-arc -O2 \
            -dynamiclib \
            -framework Foundation -framework CoreMotion \
            Tweak.m \
            -o arm64e.dylib

          xcrun lipo -create arm64.dylib arm64e.dylib -o AlohaRotationTrollFix.dylib
          ldid -Sentitlements.plist AlohaRotationTrollFix.dylib

          mkdir -p artifacts
          cp AlohaRotationTrollFix.dylib artifacts/

      - name: Verify
        run: |
          file artifacts/AlohaRotationTrollFix.dylib
          xcrun lipo -archs artifacts/AlohaRotationTrollFix.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trollinject-dylib
          path: artifacts/