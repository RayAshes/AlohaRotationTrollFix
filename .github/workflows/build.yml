name: Build AlohaRotationTrollFix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl wget tar make

      - name: Install Theos
        run: |
          curl -fsSL https://theos.dev/install.sh | sh
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS15.0 SDK via ghproxy
        run: |
          mkdir -p $HOME/theos/sdks
          cd $HOME/theos/sdks
          wget --tries=3 --timeout=20 https://mirror.ghproxy.com/https://github.com/theos/sdks/raw/master/iPhoneOS15.0.sdk.tar.xz
          tar -xf iPhoneOS15.0.sdk.tar.xz

      - name: Build tweak
        run: make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: AlohaRotationTrollFix
          path: packages/*.deb