name: Build TrollFools‑compatible dylib
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Download compatible old ldid‑2.1.5‑procdump
        run: |
          curl -fsSL -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procdump/ldid-macos
          chmod +x ./ldid

      - name: Grab SDK
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          echo "SDKROOT=$THEOS/sdks/iPhoneOS16.5.sdk" >> $GITHUB_ENV

      - name: Compile arm64 + arm64e
        run: |
          xcrun clang \
            -arch arm64 \
            -isysroot "$SDKROOT" \
            -mios-version-min=15.0 \
            -fobjc-arc -O2 \
            -dynamiclib \
            -framework Foundation -framework CoreMotion \
            Tweak.m \
            -o arm64.dylib

          xcrun clang \
            -arch arm64e \
            -isysroot "$SDKROOT" \
            -mios-version-min=15.0 \
            -fobjc-arc -O2 \
            -dynamiclib \
            -framework Foundation -framework CoreMotion \
            Tweak.m \
            -o arm64e.dylib

          xcrun lipo -create arm64.dylib arm64e.dylib -o tweak.dylib

      - name: Sign with ldid‑2.1.5‑procdump（关键）
        run: |
          ./ldid -Sentitlements:<(cat <<'EOF'
<?xml version="1.0"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
</dict>
</plist>
EOF
          ) tweak.dylib

      - name: Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tweak
          path: tweak.dylib