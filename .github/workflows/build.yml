name: Build for opa334 TrollFools (strip DRS)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Download jtool2 (to remove DRS load command)
        run: |
          curl -fsSL https://github.com/itaybre/jtool2/releases/download/2.2.1/jtool2-macos -o ./jtool2
          chmod +x ./jtool2

      - name: Get SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git ~/sdks
          git -C ~/sdks sparse-checkout set iPhoneOS16.5.sdk
          echo "SDKROOT=$HOME/sdks/iPhoneOS16.5.sdk" >> $GITHUB_ENV

      - name: Compile FAT dylib
        run: |
          xcrun clang \
            -arch arm64 \
            -isysroot "$SDKROOT" \
            -mios-version-min=15.0 \
            -fobjc-arc -O2 \
            -dynamiclib \
            -framework Foundation -framework CoreMotion \
            Tweak.m \
            -o arm64.dylib

          xcrun clang \
            -arch arm64e \
            -isysroot "$SDKROOT" \
            -mios-version-min=15.0 \
            -fobjc-arc -O2 \
            -dynamiclib \
            -framework Foundation -framework CoreMotion \
            Tweak.m \
            -o arm64e.dylib

          xcrun lipo -create arm64.dylib arm64e.dylib -o tweak.dylib

      - name: Remove LC_DYLIB_CODE_SIGN_DRS (关键修复)
        run: |
          ./jtool2 -d -delete LC_DYLIB_CODE_SIGN_DRS tweak.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tweak
          path: tweak.dylib