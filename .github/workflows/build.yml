name: Build Tweak
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl build-essential

      - name: Clone Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          cd $HOME/theos
          git submodule update --init --recursive
          chmod +x bin/*

      - name: Get iPhoneOS15.2.sdk
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git
          mv iOS-SDKs/iPhoneOS15.2.sdk .
          rm -rf iOS-SDKs

      - name: Build
        run: |
          export THEOS=$HOME/theos
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: built-deb
          path: packages/*.deb